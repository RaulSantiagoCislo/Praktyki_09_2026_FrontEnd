<div class="login-control">
  <img
    class="login-icon"
    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSwZRwSpYHN1ES36Aa8WoUvi14NFSFc6TZG633kVuS4Qg&s=10"
    alt=""
  />
  <button type="button" class="login-link" (click)="kliknijPrzycisk()">
    Zaloguj się
  </button>
</div>

@if (pokazFormularz) {
  <div class="modal-backdrop" (click)="kliknijPrzycisk()">
    <section class="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-title" (click)="$event.stopPropagation()">
      <button type="button" class="close-button" aria-label="Zamknij" (click)="kliknijPrzycisk()">&times;</button>
      <h2 id="login-title">Zaloguj się</h2>

      <input #poleEmail type="email" placeholder="Twój e-mail" />
      <input #poleHaslo type="password" placeholder="Twoje hasło" />

      <button type="button" class="submit-button" (click)="zaloguj(poleEmail.value, poleHaslo.value)">
        Zaloguj
      </button>
      <button type="button" class="cancel-button" (click)="kliknijPrzycisk()">
        Anuluj
      </button>
    </section>
  </div>
}
