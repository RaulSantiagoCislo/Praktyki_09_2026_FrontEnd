<section class="fixed left-1/2 top-20 z-50 w-[80%] max-w-[1200px] -translate-x-1/2 rounded-xl bg-orange-700 p-4">

  <div class="grid grid-cols-2 gap-4">

    <div id="EventImage" class="flex h-full min-h-[500px] items-center justify-center rounded-xl border-2 border-orange-300 bg-orange-500 text-xl text-orange-100">
      Obraz
    </div>

    <div>

      <div id="EventInformation" class="rounded-xl border-2 border-orange-300 bg-orange-600 p-4 text-white">

        <h1 class="text-3xl font-bold">{{ eventInformation.name }}</h1>

        <p class="mt-2">
          <span class="font-bold">Czas trwania:</span>
          {{ eventInformation.date }}
        </p>

        <p class="mt-2">
          <span class="font-bold">Miejsce:</span>
          {{ eventInformation.location }}
        </p>

        <p class="mt-2">
          <span class="font-bold">Organizator:</span>
          {{ eventInformation.organizer }}
        </p>

      </div>
<!--      max-h-[300px]-->
<!--      może sie przyda -->
      <div class="mt-4  overflow-y-scroll">

        @for (ticket of tickets; track ticket.id) {

          <div class="mt-2 grid grid-cols-3 gap-4 rounded-xl border-2 border-orange-300 bg-orange-600 p-4 text-white">

            <div>
              <p class="text-sm text-orange-200">Dzień</p>
              <p class="font-bold">{{ ticket.date }}</p>
            </div>

            <div>
              <p class="text-sm text-orange-200">Godzina</p>
              <p class="font-bold">{{ ticket.time }}</p>
            </div>

            <div class="flex items-center justify-end">
              <button class="btn bg-orange-300 text-orange-900 hover:bg-orange-200">
                Zakup Bilet
              </button>
            </div>

          </div>

        }

      </div>

      <button
        class="btn mt-4 mr-2 ml-auto block w-1/3 bg-orange-300 text-orange-900 hover:bg-orange-200"
        (click)="Exit()">
        Wyjdź
      </button>

    </div>

  </div>

</section>
