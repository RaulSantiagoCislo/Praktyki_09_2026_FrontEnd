<header></header>

<nav>
  <section id="Main">

    <section>
      <img
        src="https://images.seeklogo.com/logo-png/36/2/global-logic-logo-png_seeklogo-360371.png"
        width="100"
        height="100">
    </section>

    <section class="VerticalLine"></section>

    <button class="Main_Button">Tryb jasny</button>

    <section class="VerticalLine"></section>

    <button class="Main_Button" (click)="ShowSettings()">Pomoc</button>

    <section class="VerticalLine"></section>

    <button class="Main_Button" (click)="ShowLanguage()">
      {{ ChosenLanguage }}
    </button>

    <section id="VerticalLine"></section>

    <app-login (OpenRegister)="ShowRegister()"></app-login>

    <section id="Link_To_Ticket">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/b/b3/Ikona_bilety.png?utm_source=pl.wikipedia.org&utm_campaign=index&utm_content=original"
        width="50px"
        height="50px">

      <a href="Later_Menu">Przejdź do e-biletów</a>
    </section>

  </section>
</nav>

<main>
  <h1>Już dziś zorganizuj swój dzień z Global Logic e-bilet</h1>

  @if (ShowLanguage_Window && !ShowSettings_Window) {
    <app-Ch1Language (ChangingLanguage)="ChangeLanguage($event)"></app-Ch1Language>
  }

  @if (ShowSettings_Window && !ShowLanguage_Window) {
    <app-Settings></app-Settings>
  }

  @if (ShowRegister_Window) {
    <app-register (CloseRegister)="ShowRegister()"></app-register>
  }

</main>
