<div class="flex items-center gap-3 p-3 bg-slate-800 text-white rounded-xl shadow-lg border border-slate-700 max-w-xs">
  <div class="relative flex items-center justify-center w-12 h-12 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-full font-bold text-lg text-white">
    {{ user.email.charAt(0).toUpperCase() }}
    <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-800 rounded-full"></span>
  </div>
  <div class="flex flex-col text-xs leading-relaxed">
    <span class="font-semibold text-sm text-slate-100 truncate max-w-[180px]">{{ user.email }}</span>
    <span class="text-slate-400">Dołączono: {{ user.createdAt | date:'dd.MM.yyyy, HH:mm' }}</span>
    <span class="text-indigo-400 font-medium">Jesteś z nami już {{ daysWithUs }} dni! 🎉</span>
  </div>
</div>
