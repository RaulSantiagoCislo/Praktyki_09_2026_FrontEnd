<div class="relative box-border w-full max-w-md rounded-2xl border border-slate-700 bg-slate-800 p-6 text-white shadow-2xl">

  <button
    (click)="onClose()"
    class="absolute right-4 top-4 cursor-pointer border-0 bg-transparent p-1 text-xl text-slate-400 hover:text-white">
    ✕
  </button>

  <div class="mb-5 flex items-center gap-4 border-b border-slate-700 pb-4">

    <div class="flex h-14 w-14 items-center justify-center rounded-full bg-orange-500 text-2xl font-bold text-slate-900 shadow-md">
      {{ user.email ? user.email[0].toUpperCase() : 'U' }}
    </div>

    <div>
      <h2 class="text-xl font-bold text-slate-50">
        Profil Użytkownika
      </h2>

      <p class="mt-1 text-[13px] text-slate-400">
        Jesteś z nami od {{ daysWithUs }} dni
      </p>
    </div>

  </div>

  <div class="flex flex-col gap-3">

    <div class="rounded-xl border border-slate-700/50 bg-slate-900/60 p-3.5">

      <span class="mb-1 block text-[11px] font-semibold uppercase tracking-wide text-orange-500">
        E-mail
      </span>

      <span class="break-all text-sm font-medium text-slate-200">
        {{ user.email }}
      </span>

    </div>

    <div class="rounded-xl border border-slate-700/50 bg-slate-900/60 p-3.5">

      <span class="mb-1 block text-[11px] font-semibold uppercase tracking-wide text-orange-500">
        Numer telefonu
      </span>

      <span class="text-sm font-medium text-slate-200">
        {{ user.phone || 'Brak numeru' }}
      </span>

    </div>

  </div>

  <button
    (click)="onClose()"
    class="btn mt-5 w-full border-0 bg-slate-700 text-slate-50 hover:bg-slate-600">
    Zamknij
  </button>

</div>
