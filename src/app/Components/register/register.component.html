@if (!showSuccessModal) {
  <div class="fixed inset-0 z-50 flex h-screen w-screen items-center justify-center bg-black/75 backdrop-blur-sm">
    <div class="box-border w-full max-w-md rounded-2xl border border-slate-700 bg-slate-800 p-6 text-white shadow-2xl">

      <div class="mb-5 flex items-center justify-between border-b border-slate-700 pb-3">
        <h2 class="text-xl font-bold text-orange-500">
          Rejestracja
        </h2>

        <button
          type="button"
          (click)="onCancel()"
          class="cursor-pointer border-0 bg-transparent p-1 text-xl text-slate-400 hover:text-white">
          ✕
        </button>
      </div>

      @if (errorMessage) {
        <div class="mb-4 rounded-lg border border-red-400/40 bg-red-500/15 p-2.5 text-center text-[13px] text-red-400">
          {{ errorMessage }}
        </div>
      }

      <form
        [formGroup]="registerForm"
        (ngSubmit)="onSubmit()"
        class="flex flex-col gap-2.5">

        <div>
          <label class="mb-0.5 block text-[11px] uppercase text-slate-400">
            Imię
          </label>

          <input
            type="text"
            formControlName="firstName"
            class="box-border w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 outline-none focus:border-orange-500" />
        </div>

        <div>
          <label class="mb-0.5 block text-[11px] uppercase text-slate-400">
            Nazwisko
          </label>

          <input
            type="text"
            formControlName="lastName"
            class="box-border w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 outline-none focus:border-orange-500" />
        </div>

        <div>
          <label class="mb-0.5 block text-[11px] uppercase text-slate-400">
            E-mail
          </label>

          <input
            type="email"
            formControlName="email"
            class="box-border w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 outline-none focus:border-orange-500" />
        </div>

        <div>
          <label class="mb-0.5 block text-[11px] uppercase text-slate-400">
            Telefon
          </label>

          <input
            type="text"
            formControlName="phone"
            class="box-border w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 outline-none focus:border-orange-500" />
        </div>

        <div>
          <label class="mb-0.5 block text-[11px] uppercase text-slate-400">
            Hasło
          </label>

          <input
            type="password"
            formControlName="password"
            class="box-border w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 outline-none focus:border-orange-500" />
        </div>

        <div class="mt-2.5 flex gap-2.5">
          <button
            type="button"
            (click)="onCancel()"
            class="btn flex-1 border-0 bg-slate-700 text-slate-200 hover:bg-slate-600">
            Anuluj
          </button>

          <button
            type="submit"
            class="btn flex-1 border-0 bg-orange-500 font-bold text-slate-900 hover:bg-orange-600">
            Zarejestruj się
          </button>
        </div>

      </form>

    </div>
  </div>
} @else {
  <div class="fixed inset-0 z-50 flex h-screen w-screen items-center justify-center bg-black/75">
    <div class="box-border w-full max-w-sm rounded-2xl border border-slate-700 bg-slate-800 p-6 text-center text-white">

      <h3 class="mb-2 text-xl font-bold text-green-400">
        Sukces!
      </h3>

      <p class="mb-5 text-sm text-slate-300">
        Pomyślnie zarejestrowano użytkownika.
      </p>

      <button
        (click)="closeSuccessModal()"
        class="btn w-full border-0 bg-orange-500 font-bold text-slate-900 hover:bg-orange-600">
        OK
      </button>

    </div>
  </div>
}
