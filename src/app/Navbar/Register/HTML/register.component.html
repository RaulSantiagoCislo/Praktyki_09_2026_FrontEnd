<div class="modal-overlay">
  <div class="card">
    <h2>Rejestracja</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <input type="text" formControlName="firstName" placeholder="Imię" />
      </div>

      <div class="form-group">
        <input type="text" formControlName="lastName" placeholder="Nazwisko" />
      </div>

      <div class="form-group">
        <input type="email" formControlName="email" placeholder="Adres e-mail" />
      </div>

      <div class="form-group">
        <input type="tel" formControlName="phone" placeholder="Numer telefonu" />
      </div>

      <div class="form-group">
        <input type="password" formControlName="password" placeholder="Hasło" />
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="registerForm.invalid">
        Zarejestruj się
      </button>

      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        Anuluj
      </button>
    </form>
  </div>
</div>
