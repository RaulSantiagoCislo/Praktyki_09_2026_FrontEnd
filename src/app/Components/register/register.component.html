@if (!showSuccessModal) {
  <div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(4px);">
    <div style="background-color: #1e293b; color: #ffffff; width: 100%; max-width: 400px; border-radius: 16px; padding: 24px; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);">
      
      <!-- Nagłówek -->
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 20px;">
        <h2 style="margin: 0; color: #f97316; font-size: 20px; font-weight: bold;">Rejestracja</h2>
        <button type="button" (click)="onCancel()" style="background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; padding: 4px;">✕</button>
      </div>

      <!-- Błąd -->
      @if (errorMessage) {
        <div style="background-color: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #f87171; font-size: 13px; text-align: center; padding: 10px; border-radius: 8px; margin-bottom: 16px;">
          {{ errorMessage }}
        </div>
      }

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 10px;">
        <div>
          <label style="display: block; font-size: 11px; text-transform: uppercase; color: #94a3b8; margin-bottom: 2px;">Imię</label>
          <input type="text" formControlName="firstName" style="width: 100%; padding: 8px 12px; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 14px; box-sizing: border-box;" />
        </div>

        <div>
          <label style="display: block; font-size: 11px; text-transform: uppercase; color: #94a3b8; margin-bottom: 2px;">Nazwisko</label>
          <input type="text" formControlName="lastName" style="width: 100%; padding: 8px 12px; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 14px; box-sizing: border-box;" />
        </div>

        <div>
          <label style="display: block; font-size: 11px; text-transform: uppercase; color: #94a3b8; margin-bottom: 2px;">E-mail</label>
          <input type="email" formControlName="email" style="width: 100%; padding: 8px 12px; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 14px; box-sizing: border-box;" />
        </div>

        <div>
          <label style="display: block; font-size: 11px; text-transform: uppercase; color: #94a3b8; margin-bottom: 2px;">Telefon</label>
          <input type="text" formControlName="phone" style="width: 100%; padding: 8px 12px; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 14px; box-sizing: border-box;" />
        </div>

        <div>
          <label style="display: block; font-size: 11px; text-transform: uppercase; color: #94a3b8; margin-bottom: 2px;">Hasło</label>
          <input type="password" formControlName="password" style="width: 100%; padding: 8px 12px; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 14px; box-sizing: border-box;" />
        </div>

        <div style="display: flex; gap: 10px; margin-top: 10px;">
          <button type="button" (click)="onCancel()" style="flex: 1; padding: 10px; background-color: #334155; border: none; color: #e2e8f0; font-weight: 500; border-radius: 8px; cursor: pointer; font-size: 14px;">Anuluj</button>
          <button type="submit" style="flex: 1; padding: 10px; background-color: #f97316; border: none; color: #0f172a; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 14px;">Zarejestruj się</button>
        </div>
      </form>

    </div>
  </div>
} @else {
  <div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div style="background-color: #1e293b; color: #ffffff; width: 100%; max-width: 360px; border-radius: 16px; padding: 24px; border: 1px solid #334155; text-align: center;">
      <h3 style="margin: 0 0 8px 0; color: #4ade80; font-size: 20px; font-weight: bold;">Sukces!</h3>
      <p style="margin: 0 0 20px 0; font-size: 14px; color: #cbd5e1;">Pomyślnie zarejestrowano użytkownika.</p>
      <button (click)="closeSuccessModal()" style="width: 100%; padding: 10px; background-color: #f97316; border: none; color: #0f172a; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 14px;">OK</button>
    </div>
  </div>
}
